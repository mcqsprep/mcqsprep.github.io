<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQsPrep - Dashboard</title>
    
    <!-- FIREBASE CONNECTION LIBRARIES -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --primary-yellow: #fdb813;
            --primary-yellow-hover: #e0a310;
            --text-light: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #333333;
        }

        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-dark); color: var(--text-light); }

        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-dark); padding: 15px 40px; border-bottom: 1px solid var(--border-color); }
        .logo-container { display: flex; align-items: center; font-size: 24px; font-weight: bold; color: var(--text-light); cursor: pointer; }
        .logo-container span { color: var(--primary-yellow); margin-left: 2px; }
        
        .search-container { flex-grow: 1; max-width: 500px; display: flex; margin: 0 30px; }
        .search-container input { width: 100%; padding: 10px 15px; border: 1px solid var(--border-color); border-right: none; border-radius: 4px 0 0 4px; background-color: #2a2a2a; color: white; outline: none; }
        .search-container input::placeholder { color: var(--text-muted); }
        .search-container button { padding: 10px 20px; background-color: #333; border: 1px solid var(--border-color); border-radius: 0 4px 4px 0; color: white; cursor: pointer; transition: 0.2s; }
        .search-container button:hover { background-color: #444; }
        
        .nav-links { display: flex; align-items: center; gap: 20px; }
        .nav-links a { color: var(--text-light); text-decoration: none; font-weight: 500; transition: color 0.2s; cursor: pointer; }
        .nav-links a:hover { color: var(--primary-yellow); }
        .highlight-nav { color: var(--primary-yellow) !important; font-weight: bold; text-shadow: 0 0 8px rgba(253, 184, 19, 0.4); }

        .breadcrumb { background-color: #1a1a1a; padding: 10px 40px; font-size: 14px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); }

        .container { display: flex; padding: 40px; gap: 30px; max-width: 1400px; margin: 0 auto; }
        .main-content { flex: 2; }
        .sidebar { flex: 1; max-width: 400px; }

        .card { background-color: var(--card-bg); border-radius: 8px; padding: 25px; margin-bottom: 25px; border: 1px solid var(--border-color); }
        .card h2, .card h3 { margin-top: 0; margin-bottom: 20px; font-size: 20px; }

        .btn-exam { padding: 15px; border-radius: 6px; border: 1px solid var(--border-color); background-color: #2a2a2a; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-exam:hover { background-color: #382909; border-color: var(--primary-yellow); color: var(--primary-yellow); }

        .action-link { display: block; padding: 12px 15px; background-color: #2a2a2a; border: 1px solid var(--border-color); border-radius: 6px; color: white; text-decoration: none; margin-bottom: 10px; transition: 0.2s; }
        .action-link:hover { border-color: var(--primary-yellow); background-color: #333; }
        
        table th, table td { padding: 12px; border-bottom: 1px solid var(--border-color); text-align: left; }

        #notification { display: none; position: fixed; bottom: 20px; right: 20px; background-color: var(--primary-yellow); color: #000; padding: 15px 25px; border-radius: 5px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 1000; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo-container" onclick="goHome()">
            🩺 MCQsPrep<span>.</span>
        </div>
        
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search for NCERT topics, physics concepts..." onkeypress="handleSearch(event)">
            <button onclick="executeSearch()">Search</button>
        </div>

        <div class="nav-links">
            <a onclick="goHome()">Home</a>
            <a onclick="showLeaderboardOptions()" class="highlight-nav">Leaderboard</a>
        </div>
    </nav>

    <div class="breadcrumb" id="breadcrumb-text">
        Home / Select Exam
    </div>

    <div class="container">
        <div class="main-content" id="dynamic-content"></div>

        <div class="sidebar">
            <div class="card">
                <h3>Quick Links</h3>
                <a href="#" class="action-link" onclick="jumpToSection(['NEET', 'NCERT Book'])">📚 NCERT Solutions</a>
                <a href="#" class="action-link" onclick="jumpToSection(['NEET', 'PYQs'])">📄 Previous Year Papers</a>
            </div>

            <div class="card">
                <h3>Essential Practice</h3>
                <a href="#" class="action-link" onclick="jumpToSection(['NEET', 'MCQs Practice'])">📝 Subject-wise MCQs</a>
                <a href="#" class="action-link" onclick="jumpToSection(['NEET', 'Mock Test'])">⏱️ Full-Length Mock Tests</a>
                <a href="#" class="action-link" onclick="jumpToSection(['NEET', 'Practice Paper', 'Mixed'])">📅 Daily Quiz Challenge</a>
            </div>
        </div>
    </div>

    <div id="notification">Action Triggered!</div>

    <script>
        // --- 1. FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDuIetjxv1THjWvWLvO0XqB_z5xBBXLwL8",
            authDomain: "mcqsprep.firebaseapp.com",
            projectId: "mcqsprep",
            storageBucket: "mcqsprep.firebasestorage.app",
            messagingSenderId: "920181103186",
            appId: "1:920181103186:web:14c2ba261d4a6163db5d8b"
        };
        // Wake up Firebase using your exact keys
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- 2. MENU DATABASE ---
        const appData = {
            "NEET": {
                "NCERT Book": {
                    "Class 11": { "Zoology": [], "Botany": [], "Physics": [], "Chemistry": [] },
                    "Class 12": { "Zoology": [], "Botany": [], "Physics": [], "Chemistry": [] }
                },
                "PYQs": { "2026": [], "2025": [], "2024": [], "2023": [], "2022": [], "2021": [], "2020": [], "2019": [], "2018": [], "2017": [], "2016": [], "2015": [], "2014": [], "2013": [], "2012": [], "2011": [] },
                "Practice Paper": { "Easy": [], "Medium": [], "Hard": [], "Mixed": [] },
                "MCQs Practice": {
                    "Botany": { "Easy": [], "Medium": [], "Hard": [], "Mixed": [] },
                    "Zoology": { "Easy": [], "Medium": [], "Hard": [], "Mixed": [] },
                    "Physics": { "Easy": [], "Medium": [], "Hard": [], "Mixed": [] },
                    "Organic Chemistry": { "Easy": [], "Medium": [], "Hard": [], "Mixed": [] },
                    "Physical Chemistry": { "Easy": [], "Medium": [], "Hard": [], "Mixed": [] },
                    "Inorganic Chemistry": { "Easy": [], "Medium": [], "Hard": [], "Mixed": [] }
                },
                "Mock Test": "COMING SOON"
            },
            "General Knowledge": { "Current Affairs": [], "History": [], "Geography": [] }
        };

        let currentPath = []; 

        function renderView() {
            const mainContent = document.getElementById('dynamic-content');
            const breadcrumb = document.getElementById('breadcrumb-text');
            if (currentPath.length === 0) { breadcrumb.innerText = "Home / Select Exam"; } 
            else { breadcrumb.innerText = "Home / " + currentPath.join(" / "); }

            let currentLevel = appData;
            for (let node of currentPath) { currentLevel = currentLevel[node]; }

            if (Array.isArray(currentLevel)) {
                mainContent.innerHTML = `<div class="card"><h2>${currentPath[currentPath.length - 1]}</h2><p style="color: var(--text-muted); margin-bottom: 20px;">This section is ready for MCQs.</p><button class="btn-exam" onclick="goBack()" style="width: 200px; background-color: #333;">&larr; Go Back</button></div>`;
                return;
            }
            if (typeof currentLevel === 'string') {
                mainContent.innerHTML = `<div class="card"><h2>${currentPath[currentPath.length - 1]}</h2><h3 style="color: var(--primary-yellow); font-size: 24px; padding: 20px 0;">${currentLevel}</h3><button class="btn-exam" onclick="goBack()" style="width: 200px; background-color: #333;">&larr; Go Back</button></div>`;
                return;
            }

            let title = currentPath.length === 0 ? "Select Exam:" : currentPath[currentPath.length - 1];
            let html = `<div class="card"><h2>${title}</h2><div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px;">`;
            for (let key in currentLevel) { html += `<button class="btn-exam" onclick="navigateTo('${key}')">${key}</button>`; }
            if (currentPath.length > 0) { html += `<button class="btn-exam" onclick="goBack()" style="grid-column: 1 / -1; background-color: #222; border-color: #444; color: #a0a0a0;">&larr; Go Back</button>`; }
            html += `</div></div>`;
            mainContent.innerHTML = html;
        }

        // --- 3. CLOUD LEADERBOARD ---
        function showLeaderboardOptions() {
            const mainContent = document.getElementById('dynamic-content');
            document.getElementById('breadcrumb-text').innerText = "Home / Leaderboard";
            currentPath = []; 
            mainContent.innerHTML = `
                <div class="card">
                    <h2>🏆 Select Leaderboard</h2>
                    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 20px;">
                        <button class="btn-exam" onclick="fetchLiveLeaderboard('Practice Leaderboard')">1. PRACTICE LEADERBOARD</button>
                        <button class="btn-exam" onclick="fetchLiveLeaderboard('Mock Test Leaderboard')">2. MOCK TEST LEADERBOARD</button>
                    </div>
                </div>`;
        }

        function fetchLiveLeaderboard(type) {
            const mainContent = document.getElementById('dynamic-content');
            document.getElementById('breadcrumb-text').innerText = "Home / Leaderboard / " + type;
            let activityHeader = type === 'Practice Leaderboard' ? 'Q. ATTEMPTED' : 'Tests Taken';
            
            // Show a loading message while it asks the database
            mainContent.innerHTML = `<div class="card"><h2>🏆 ${type}</h2><p style="color: var(--primary-yellow);">Fetching live rankings from Firebase...</p></div>`;

            // Ask Firebase for scores
            db.collection("leaderboard").where("type", "==", type).get()
            .then((querySnapshot) => {
                let students = [];
                querySnapshot.forEach((doc) => { students.push(doc.data()); });

                // Sort students by accuracy
                students.sort((a, b) => b.accuracy - a.accuracy);

                let tableHTML = `
                <div class="card">
                    <h2>🏆 ${type}</h2>
                    <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
                        <tr style="color: var(--primary-yellow);">
                            <th>Rank</th><th>Student Name</th><th>${activityHeader}</th><th>Accuracy</th>
                        </tr>`;

                if (students.length === 0) {
                    tableHTML += `<tr><td colspan="4" style="text-align: center; padding: 30px; color: var(--text-muted);">No scores yet! Be the first to take a test.</td></tr>`;
                } else {
                    students.forEach((student, index) => {
                        let medal = index === 0 ? '🥇 ' : index === 1 ? '🥈 ' : index === 2 ? '🥉 ' : '';
                        tableHTML += `<tr><td>${medal}${index + 1}</td><td>${student.name}</td><td>${student.tests}</td><td>${student.accuracy}%</td></tr>`;
                    });
                }

                // Temporary button for you to test the database!
                tableHTML += `</table>
                <div style="display: flex; gap: 15px; margin-top: 25px;">
                    <button class="btn-exam" onclick="showLeaderboardOptions()" style="background-color: #333;">&larr; Go Back</button>
                    <button class="btn-exam" onclick="addFakeScore('${type}')" style="background-color: #10b981; border-color: #10b981; color: black;">+ Simulate a Student Finishing a Test</button>
                </div></div>`;
                
                mainContent.innerHTML = tableHTML;
            }).catch((error) => {
                showNotification("Error connecting to Firebase: " + error.message);
            });
        }

        // Test function: Writes a score to your database
        function addFakeScore(type) {
            showNotification("Saving score to database...");
            const names = ["Rohan Verma", "Sneha Patel", "Aditya Sharma", "Kavya Reddy", "Aman Singh"];
            
            db.collection("leaderboard").add({
                name: names[Math.floor(Math.random() * names.length)],
                tests: Math.floor(Math.random() * 50) + 5,
                accuracy: (Math.random() * (100 - 80) + 80).toFixed(1),
                type: type
            }).then(() => {
                fetchLiveLeaderboard(type); // Refresh table automatically
                showNotification("Success! Cloud database updated.");
            });
        }

        // --- 4. NAVIGATION & SEARCH ---
        function navigateTo(key) { currentPath.push(key); renderView(); }
        function goBack() { currentPath.pop(); renderView(); }
        function goHome() { currentPath = []; renderView(); }
        function jumpToSection(pathArray) { currentPath = pathArray; renderView(); }
        function showNotification(message) {
            const notif = document.getElementById('notification');
            notif.innerText = message;
            notif.style.display = 'block';
            setTimeout(() => { notif.style.display = 'none'; }, 3000);
        }
        
        function executeSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if(query === "") { showNotification("Please enter a topic."); return; }
            let results = [];
            function searchDB(obj, q, path = []) {
                for (let key in obj) {
                    let current = [...path, key];
                    if (key.toLowerCase().includes(q.toLowerCase())) results.push(current);
                    if (typeof obj[key] === 'object' && !Array.isArray(obj[key])) searchDB(obj[key], q, current);
                }
            }
            searchDB(appData, query);
            const mainContent = document.getElementById('dynamic-content');
            document.getElementById('breadcrumb-text').innerText = `Home / Search: "${query}"`;
            currentPath = [];
            if (results.length === 0) {
                mainContent.innerHTML = `<div class="card"><h2>No results found for "${query}"</h2><button class="btn-exam" onclick="goHome()" style="width: 200px; margin-top: 15px;">&larr; Back to Home</button></div>`;
                return;
            }
            let html = `<div class="card"><h2>Search Results for "${query}"</h2><div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px;">`;
            results.forEach(pathArray => {
                html += `<button class="btn-exam" onclick="jumpToSection(${JSON.stringify(pathArray).replace(/"/g, "'")})">${pathArray.join(" ➔ ")}</button>`;
            });
            html += `</div></div>`;
            mainContent.innerHTML = html;
        }
        function handleSearch(event) { if (event.key === 'Enter') executeSearch(); }

        renderView();
    </script>
</body>
</html>
