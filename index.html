<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQsPrep - Dashboard</title>
    
    <!-- FIREBASE CONNECTION LIBRARIES -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --primary-yellow: #fdb813;
            --primary-yellow-hover: #e0a310;
            --text-light: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #333333;
        }

        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-dark); color: var(--text-light); }

        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-dark); padding: 15px 40px; border-bottom: 1px solid var(--border-color); position: relative; }
        .logo-container { display: flex; align-items: center; font-size: 24px; font-weight: bold; color: var(--text-light); cursor: pointer; white-space: nowrap; }
        .logo-container span { color: var(--primary-yellow); margin-left: 2px; }
        
        /* NEW DYNAMIC SEARCH BAR STYLES */
        .search-wrapper { position: relative; display: flex; justify-content: flex-end; align-items: center; flex-grow: 1; margin: 0 30px; transition: 0.3s ease; }
        .search-icon-btn { background: #2a2a2a; border: 1px solid var(--border-color); color: white; font-size: 18px; cursor: pointer; padding: 10px 15px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .search-icon-btn:hover { background: #333; }
        
        .search-input-container { display: none; width: 100%; max-width: 600px; position: relative; }
        .search-wrapper.active .search-icon-btn { display: none; }
        .search-wrapper.active .search-input-container { display: flex; align-items: center; }
        
        .search-input-container input { width: 100%; padding: 12px 45px 12px 20px; border-radius: 24px; border: 1px solid var(--border-color); background: #2a2a2a; color: white; outline: none; font-size: 16px; transition: 0.2s; }
        .search-input-container input:focus { border-color: var(--primary-yellow); background: #1e1e1e; }
        .search-close-btn { position: absolute; right: 15px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 20px; font-weight: bold; padding: 0; }
        .search-close-btn:hover { color: white; }

        /* LIVE SUGGESTIONS DROPDOWN */
        .suggestions-dropdown { display: none; position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; z-index: 2000; max-height: 350px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.8); }
        .suggestion-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid var(--border-color); color: white; display: flex; align-items: center; gap: 12px; font-size: 15px; }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: #2a2a2a; color: var(--primary-yellow); }
        
        .nav-links { display: flex; align-items: center; gap: 20px; white-space: nowrap; }
        .nav-links a { color: var(--text-light); text-decoration: none; font-weight: 500; transition: color 0.2s; cursor: pointer; }
        .nav-links a:hover { color: var(--primary-yellow); }
        .highlight-nav { color: var(--primary-yellow) !important; font-weight: bold; text-shadow: 0 0 8px rgba(253, 184, 19, 0.4); }

        .breadcrumb { background-color: #1a1a1a; padding: 10px 40px; font-size: 14px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); }

        .container { display: flex; padding: 40px; gap: 30px; max-width: 1400px; margin: 0 auto; }
        .main-content { flex: 2; }
        .sidebar { flex: 1; max-width: 400px; }

        .card { background-color: var(--card-bg); border-radius: 8px; padding: 25px; margin-bottom: 25px; border: 1px solid var(--border-color); }
        .card h2, .card h3 { margin-top: 0; margin-bottom: 20px; font-size: 20px; }

        .btn-exam { padding: 15px; border-radius: 6px; border: 1px solid var(--border-color); background-color: #2a2a2a; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-exam:hover { background-color: #382909; border-color: var(--primary-yellow); color: var(--primary-yellow); }

        .action-link { display: block; padding: 12px 15px; background-color: #2a2a2a; border: 1px solid var(--border-color); border-radius: 6px; color: white; text-decoration: none; margin-bottom: 10px; transition: 0.2s; }
        .action-link:hover { border-color: var(--primary-yellow); background-color: #333; }
        
        .input-field { width: 100%; max-width: 300px; padding: 12px; margin-bottom: 15px; border-radius: 4px; border: 1px solid var(--border-color); background: #2a2a2a; color: white; box-sizing: border-box; font-size: 16px; display: block; }
        .input-field:focus { outline: none; border-color: var(--primary-yellow); }

        table th, table td { padding: 12px; border-bottom: 1px solid var(--border-color); text-align: left; }

        #notification { display: none; position: fixed; bottom: 20px; right: 20px; background-color: var(--primary-yellow); color: #000; padding: 15px 25px; border-radius: 5px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 1000; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo-container" onclick="goHome()">
            🩺 MCQsPrep<span>.</span>
        </div>
        
        <!-- NEW SEARCH ARCHITECTURE -->
        <div class="search-wrapper" id="searchWrapper">
            <button class="search-icon-btn" onclick="openSearch()">🔍</button>
            <div class="search-input-container">
                <input type="text" id="searchInput" placeholder="Search MCQs, chapters, mock tests..." oninput="handleLiveSearch()" onblur="delayCloseSearch()">
                <button class="search-close-btn" onclick="closeSearch()">✕</button>
                <div class="suggestions-dropdown" id="searchSuggestions"></div>
            </div>
        </div>

        <div class="nav-links">
            <a onclick="goHome()">Home</a>
            <a onclick="showLeaderboardOptions()" class="highlight-nav">Leaderboard</a>
        </div>
    </nav>

    <div class="breadcrumb" id="breadcrumb-text">
        Home / Select Exam
    </div>

    <div class="container">
        <div class="main-content" id="dynamic-content"></div>

        <div class="sidebar">
            <div class="card">
                <h3>Quick Links</h3>
                <a href="#" class="action-link" onclick="jumpToSection(['NEET', 'NCERT Book'])">📚 NCERT Solutions</a>
                <a href="#" class="action-link" onclick="jumpToSection(['NEET', 'PYQs'])">📄 Previous Year Papers</a>
            </div>

            <div class="card">
                <h3>Essential Practice</h3>
                <a href="#" class="action-link" onclick="jumpToSection(['NEET', 'MCQs Practice'])">📝 Subject-wise MCQs</a>
                <a href="#" class="action-link" onclick="jumpToSection(['NEET', 'Mock Test'])">⏱️ Full-Length Mock Tests</a>
                <a href="#" class="action-link" onclick="jumpToSection(['NEET', 'Practice Paper', 'Mixed'])">📅 Daily Quiz Challenge</a>
            </div>
        </div>
    </div>

    <div id="notification">Action Triggered!</div>

    <script>
        // --- 1. FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDuIetjxv1THjWvWLvO0XqB_z5xBBXLwL8",
            authDomain: "mcqsprep.firebaseapp.com",
            projectId: "mcqsprep",
            storageBucket: "mcqsprep.firebasestorage.app",
            messagingSenderId: "920181103186",
            appId: "1:920181103186:web:14c2ba261d4a6163db5d8b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- 2. MENU DATABASE ---
        const appData = {
            "NEET": {
                "NCERT Book": {
                    "Class 11": { "Zoology": [], "Botany": [], "Physics": [], "Chemistry": [] },
                    "Class 12": { "Zoology": [], "Botany": [], "Physics": [], "Chemistry": [] }
                },
                "PYQs": { "2026": [], "2025": [], "2024": [], "2023": [], "2022": [], "2021": [], "2020": [], "2019": [], "2018": [], "2017": [], "2016": [], "2015": [], "2014": [], "2013": [], "2012": [], "2011": [] },
                "Practice Paper": { "Easy": [], "Medium": [], "Hard": [], "Mixed": [] },
                "MCQs Practice": {
                    "Botany": { "Easy": [], "Medium": [], "Hard": [], "Mixed": [] },
                    "Zoology": { "Easy": [], "Medium": [], "Hard": [], "Mixed": [] },
                    "Physics": { "Easy": [], "Medium": [], "Hard": [], "Mixed": [] },
                    "Organic Chemistry": { "Easy": [], "Medium": [], "Hard": [], "Mixed": [] },
                    "Physical Chemistry": { "Easy": [], "Medium": [], "Hard": [], "Mixed": [] },
                    "Inorganic Chemistry": { "Easy": [], "Medium": [], "Hard": [], "Mixed": [] }
                },
                "Mock Test": "COMING SOON"
            },
            "General Knowledge": { "Current Affairs": [], "History": [], "Geography": [] }
        };

        let currentPath = []; 
        let currentStudentName = "";

        // NEW LOGIC: Checks if the path requires a Name/Quiz setup
        function requiresQuizLogin(pathArray) {
            const pathString = pathArray.join(" > ").toLowerCase();
            const triggers = ["mcqs practice", "mock test", "general knowledge", "practice paper"];
            return triggers.some(trigger => pathString.includes(trigger));
        }

        function renderView() {
            const mainContent = document.getElementById('dynamic-content');
            const breadcrumb = document.getElementById('breadcrumb-text');
            if (currentPath.length === 0) { breadcrumb.innerText = "Home / Select Exam"; } 
            else { breadcrumb.innerText = "Home / " + currentPath.join(" / "); }

            let currentLevel = appData;
            for (let node of currentPath) { currentLevel = currentLevel[node]; }

            // WHEN THEY REACH THE END OF A FOLDER
            if (Array.isArray(currentLevel) || typeof currentLevel === 'string') {
                let topicName = currentPath[currentPath.length - 1];
                let isGK = currentPath[0] === "General Knowledge";
                let leaderboardType = isGK ? 'GK Leaderboard' : 'NEET Practice Leaderboard';

                // SMART FILTER: Only ask name for Quiz sections!
                if (requiresQuizLogin(currentPath)) {
                    mainContent.innerHTML = `
                        <div class="card">
                            <h2>${topicName} Practice</h2>
                            <p style="color: var(--text-muted); margin-bottom: 20px;">Enter your name below to begin the quiz. Your score will be recorded on the ${leaderboardType}.</p>
                            <input type="text" id="studentNameInput" class="input-field" placeholder="Enter your full name..." autocomplete="off">
                            <div style="display: flex; gap: 15px;">
                                <button class="btn-exam" onclick="startQuiz('${leaderboardType}')" style="background-color: var(--primary-yellow); color: black; border: none; width: 200px;">Start Quiz &rarr;</button>
                                <button class="btn-exam" onclick="goBack()" style="width: 150px; background-color: #333;">&larr; Go Back</button>
                            </div>
                        </div>`;
                } else {
                    // If it's NCERT, PYQs, etc., just show the PDF/Study Material placeholder
                    mainContent.innerHTML = `
                        <div class="card">
                            <h2>${topicName} Resources</h2>
                            <p style="color: var(--text-muted); margin-bottom: 20px;">Read and download study materials for this topic.</p>
                            
                            <div style="padding: 50px 20px; background-color: #2a2a2a; border-radius: 8px; border: 1px dashed var(--border-color); text-align: center;">
                                <div style="font-size: 40px; margin-bottom: 15px;">📄</div>
                                <h3 style="margin-bottom: 10px; color: white;">PDF Viewer / Notes</h3>
                                <p style="color: var(--text-muted); font-size: 14px;">(No login required to read study materials. Document will load here.)</p>
                            </div>
                            
                            <button class="btn-exam" onclick="goBack()" style="width: 200px; margin-top: 20px; background-color: #333;">&larr; Go Back</button>
                        </div>`;
                }
                return;
            }

            let title = currentPath.length === 0 ? "Select Exam:" : currentPath[currentPath.length - 1];
            let html = `<div class="card"><h2>${title}</h2><div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px;">`;
            for (let key in currentLevel) { html += `<button class="btn-exam" onclick="navigateTo('${key}')">${key}</button>`; }
            if (currentPath.length > 0) { html += `<button class="btn-exam" onclick="goBack()" style="grid-column: 1 / -1; background-color: #222; border-color: #444; color: #a0a0a0;">&larr; Go Back</button>`; }
            html += `</div></div>`;
            mainContent.innerHTML = html;
        }

        function startQuiz(leaderboardCategory) {
            const nameInput = document.getElementById('studentNameInput').value.trim();
            if (nameInput === "") { showNotification("⚠️ Please enter your name to start the quiz."); return; }
            currentStudentName = nameInput;
            const mainContent = document.getElementById('dynamic-content');
            mainContent.innerHTML = `<div class="card"><h2>Quiz Starting...</h2><p style="color: var(--primary-yellow); font-size: 18px;">Best of luck, ${currentStudentName}!</p><p style="color: var(--text-muted); margin-top: 15px;">(Quiz Engine loads here next...)</p><button class="btn-exam" onclick="goBack()" style="width: 200px; margin-top: 20px; background-color: #333;">&larr; Cancel Quiz</button></div>`;
        }

        // --- 3. DYNAMIC SEARCH UI LOGIC ---
        function openSearch() {
            document.getElementById('searchWrapper').classList.add('active');
            document.getElementById('searchInput').focus(); // Automatically triggers mobile keyboard
        }

        function closeSearch() {
            document.getElementById('searchWrapper').classList.remove('active');
            document.getElementById('searchInput').value = '';
            document.getElementById('searchSuggestions').style.display = 'none';
        }

        function delayCloseSearch() {
            // Slight delay so if a user clicks a suggestion, it registers before the dropdown vanishes
            setTimeout(closeSearch, 250); 
        }

        function handleLiveSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const dropdown = document.getElementById('searchSuggestions');
            if(query === "") { dropdown.style.display = 'none'; return; }
            
            let results = [];
            function searchDB(obj, q, path = []) {
                for (let key in obj) {
                    let current = [...path, key];
                    if (key.toLowerCase().includes(q)) results.push(current);
                    if (typeof obj[key] === 'object' && !Array.isArray(obj[key])) searchDB(obj[key], q, current);
                }
            }
            searchDB(appData, query);
            
            if(results.length > 0) {
                dropdown.innerHTML = results.slice(0, 8).map(pathArray => {
                    const cleanPath = JSON.stringify(pathArray).replace(/"/g, "'");
                    return `<div class="suggestion-item" onclick="jumpToSection(${cleanPath}); closeSearch();">🔍 <span>${pathArray.join(" <span style='color:var(--text-muted);font-size:12px;'>&rarr;</span> ")}</span></div>`;
                }).join('');
            } else {
                dropdown.innerHTML = `<div class="suggestion-item" style="color: var(--text-muted);">No results match "${query}"</div>`;
            }
            dropdown.style.display = 'block';
        }

        // --- 4. CLOUD LEADERBOARD ---
        function showLeaderboardOptions() {
            const mainContent = document.getElementById('dynamic-content');
            document.getElementById('breadcrumb-text').innerText = "Home / Leaderboard";
            currentPath = []; 
            mainContent.innerHTML = `<div class="card"><h2>🏆 Select Leaderboard</h2><div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 20px;"><button class="btn-exam" onclick="fetchLiveLeaderboard('NEET Practice Leaderboard')">1. NEET PRACTICE</button><button class="btn-exam" onclick="fetchLiveLeaderboard('NEET Mock Test Leaderboard')">2. NEET MOCK TESTS</button><button class="btn-exam" onclick="fetchLiveLeaderboard('GK Leaderboard')" style="border-color: #4CAF50;">3. GENERAL KNOWLEDGE</button></div></div>`;
        }

        function fetchLiveLeaderboard(type) {
            const mainContent = document.getElementById('dynamic-content');
            document.getElementById('breadcrumb-text').innerText = "Home / Leaderboard / " + type;
            let activityHeader = type === 'NEET Mock Test Leaderboard' ? 'Tests Taken' : 'Q. ATTEMPTED';
            mainContent.innerHTML = `<div class="card"><h2>🏆 ${type}</h2><p style="color: var(--primary-yellow);">Fetching live rankings from Firebase...</p></div>`;

            db.collection("leaderboard").where("type", "==", type).get()
            .then((querySnapshot) => {
                let students = [];
                querySnapshot.forEach((doc) => { 
                    let data = doc.data();
                    if ((type === 'NEET Practice Leaderboard' || type === 'GK Leaderboard') && data.tests >= 100) { students.push(data); } 
                    else if (type === 'NEET Mock Test Leaderboard' && data.tests >= 10) { students.push(data); }
                });

                students.sort((a, b) => b.accuracy - a.accuracy);
                let tableHTML = `<div class="card"><h2>🏆 ${type}</h2><table style="width: 100%; border-collapse: collapse; margin-top: 10px;"><tr style="color: var(--primary-yellow);"><th>Rank</th><th>Student Name</th><th>${activityHeader}</th><th>Accuracy</th></tr>`;

                if (students.length === 0) {
                    let req = type === 'NEET Mock Test Leaderboard' ? '10 Tests Taken' : '100 Questions Attempted';
                    tableHTML += `<tr><td colspan="4" style="text-align: center; padding: 30px; color: var(--text-muted);">The leaderboard is waiting! To rank here, students must complete at least ${req}.</td></tr>`;
                } else {
                    students.forEach((student, index) => {
                        let medal = index === 0 ? '🥇 ' : index === 1 ? '🥈 ' : index === 2 ? '🥉 ' : '';
                        tableHTML += `<tr><td>${medal}${index + 1}</td><td>${student.name}</td><td>${student.tests}</td><td>${student.accuracy}%</td></tr>`;
                    });
                }
                tableHTML += `</table><div style="display: flex; gap: 15px; margin-top: 25px;"><button class="btn-exam" onclick="showLeaderboardOptions()" style="background-color: #333;">&larr; Go Back</button></div></div>`;
                mainContent.innerHTML = tableHTML;
            }).catch((error) => { showNotification("Error connecting to Firebase: " + error.message); });
        }

        // --- 5. NAVIGATION HELPER ---
        function navigateTo(key) { currentPath.push(key); renderView(); }
        function goBack() { currentPath.pop(); renderView(); }
        function goHome() { currentPath = []; renderView(); }
        function jumpToSection(pathArray) { currentPath = pathArray; renderView(); }
        function showNotification(message) {
            const notif = document.getElementById('notification');
            notif.innerText = message;
            notif.style.display = 'block';
            setTimeout(() => { notif.style.display = 'none'; }, 3000);
        }

        renderView();
    </script>
</body>
</html>
