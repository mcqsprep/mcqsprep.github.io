<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQsPrep - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <!-- Clicking the logo takes you back to the main menu -->
        <div class="logo-container" onclick="goHome()">
            🩺 MCQsPrep<span>.</span>
        </div>
        
        <!-- Functional Search Bar -->
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search for NCERT topics, physics concepts, biology subtopics..." onkeypress="handleSearch(event)">
            <button onclick="executeSearch()">Search</button>
        </div>

        <div class="nav-links">
            <a href="#" onclick="goHome()">Home</a>
            <a href="#" onclick="showNotification('Loading Courses Directory...')">Courses</a>
            <a href="#" onclick="showNotification('Fetching Live Leaderboard...')">Leaderboard</a>
            <button class="btn-login" onclick="showNotification('Opening Login/Register Modal...')">Login | Register</button>
        </div>
    </nav>

    <!-- Breadcrumb Trail -->
    <div class="breadcrumb">
        Home / Select Exam
    </div>

    <!-- Main Layout Grid -->
    <div class="container">
        
        <!-- Left Side: Main Content -->
        <!-- Notice this is empty! Your script.js will automatically inject the NEET/GK buttons here -->
        <div class="main-content">
            
        </div>

        <!-- Right Side: Sidebar Functionality -->
        <div class="sidebar">
            
            <!-- Quick Links -->
            <div class="card">
                <h3>Quick Links</h3>
                <a href="#" class="action-link" onclick="jumpToSection(['NEET', 'NCERT Book'])">📚 NCERT Solutions</a>
                <a href="#" class="action-link" onclick="jumpToSection(['NEET', 'PYQs'])">📄 Previous Year Papers</a>
            </div>

            <!-- Essential Practice -->
            <div class="card">
                <h3>Essential Practice</h3>
                <a href="#" class="action-link" onclick="jumpToSection(['NEET', 'MCQs Practice'])">📝 Subject-wise MCQs</a>
                <a href="#" class="action-link" onclick="jumpToSection(['NEET', 'Mock Test'])">⏱️ Full-Length Mock Tests</a>
                <a href="#" class="action-link" onclick="jumpToSection(['NEET', 'Practice Paper', 'Mixed'])">📅 Daily Quiz Challenge</a>
            </div>

        </div>
    </div>

    <!-- Notification Pop-up -->
    <div id="notification">Action Triggered!</div>

    <!-- Link to your external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
