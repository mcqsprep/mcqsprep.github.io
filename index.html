<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQs Prep | Competitive Exam Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav>
        <div class="logo">MCQs Prep.</div>
        <div class="nav-links">Home</div>
    </nav>

    <div class="main-container">
        
        <!-- SECTION 1: The Category Menu (Visible on load) -->
        <div id="category-screen">
            <h1>Select Your Exam</h1>
            <p class="subtitle">Choose a category to start practicing.</p>
            
            <div class="category-grid" id="category-grid">
                <!-- JavaScript will inject the main exams here (NEET, JEE, GK) -->
            </div>
            
            <!-- Hidden back button for navigation -->
            <button id="back-btn" class="hidden" onclick="goBack()">&larr; Back</button>
        </div>

        <!-- SECTION 2: The Quiz Engine (Hidden until a topic is selected) -->
        <div id="quiz-screen" class="hidden">
            <header>
                <h2 id="exam-title">Exam Title</h2>
                <div class="score-board">Score: <span id="score">0</span></div>
            </header>
            
            <div id="quiz-content">
                <h3 id="question">Loading question...</h3>
                <div class="options-container" id="options">
                    <!-- Buttons will be generated by JavaScript -->
                </div>
                <button id="next-btn" class="hidden" onclick="nextQuestion()">Next Question</button>
            </div>

            <!-- Results Screen -->
            <div id="result-screen" class="hidden">
                <h2>Test Completed!</h2>
                <p>Your Final Score: <span id="final-score">0</span> / <span id="total-questions">0</span></p>
                <button class="primary-btn" onclick="location.reload()">Return to Home</button>
            </div>
        </div>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
