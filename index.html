<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9DMLHEWB1Q"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9DMLHEWB1Q');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQsPrep - Dashboard</title>
    <meta name="description" content="MCQsPrep - A free, smart MCQ practice platform for competitive exams.">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>">
    <link rel="stylesheet" href="style.css">
    
    <!-- FIREBASE & AI LIBRARIES -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body>

    <!-- Main Navigation Bar -->
    <nav class="navbar">
        <div style="display: flex; align-items: center; min-width: 0;">
            <div class="logo-container" onclick="goHome()">🩺 MCQsPrep<span>.</span></div>
            <div class="nav-rating-badge">
                <span class="rating-text">Overall: <span>⭐ <span id="global-rating-display">5.0</span>/5</span></span>
                <button onclick="openFeedbackModal()">⭐ Rate Us</button>
            </div>
        </div>
        <div class="nav-links">
            <a onclick="goHome()">Home</a>
            <a onclick="navigateToLayer('layer-analytics-selection')">Leaderboard</a>
            <div class="profile-wrapper">
                <div id="userBadge" class="user-badge" onclick="toggleProfileMenu()">
                    <span id="userNameDisplay">Student</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="breadcrumb" id="breadcrumb-text">Home</div>
    
    <div class="container">
        <!-- 🌟 THE STACKED VIEW MANAGER 🌟 -->
        <div class="main-content" id="app-stack-container">
            
            <!-- LAYER 1: Home Dashboard (Base Layer) -->
            <div id="layer-home" class="app-layer" style="display: block;">
                <!-- Your original dynamic content goes here -->
                <div id="dynamic-content">
                    <div class="card">
                        <h2>Welcome to MCQsPrep</h2>
                        <button class="btn-exam" onclick="navigateToLayer('layer-analytics-selection')">Track My Progress</button>
                    </div>
                </div>
            </div>

            <!-- LAYER 2: Analytics Selection -->
            <div id="layer-analytics-selection" class="app-layer" style="display: none;">
                <div class="card" style="text-align: center;">
                    <h2>📊 Select Analytics Dashboard</h2>
                    <p>Choose an exam category to view your detailed performance metrics.</p>
                    <div style="display: flex; gap: 15px; justify-content: center; margin: 25px 0;">
                        <button class="btn-exam" style="background: #2b2b2b;" onclick="navigateToLayer('layer-gk-detail')">🌍 GK Analytics</button>
                    </div>
                    <button class="btn-exam" onclick="goBack()">← Back</button>
                </div>
            </div>

            <!-- LAYER 3: Detailed GK Analytics -->
            <div id="layer-gk-detail" class="app-layer" style="display: none;">
                <div class="card">
                    <h2 style="color: var(--primary-yellow);">General Knowledge</h2>
                    <div class="admin-row">
                        <div style="background: #252525; padding: 20px; border-radius: 8px; text-align: center;">
                            <h3 style="margin:0;">9</h3><p style="margin:5px 0 0 0; font-size:12px;">ATTEMPTED</p>
                        </div>
                    </div>
                    <br>
                    <button class="btn-exam" onclick="goBack()">← Back to Selection</button>
                </div>
            </div>

        </div>

        <div class="sidebar" id="main-sidebar">
            <div class="card">
                <h3>Quick Links</h3>
                <a class="action-link" onclick="jumpToSection(['NEET', 'NCERT Book'])">📚 NCERT Books</a>
                <a class="action-link" onclick="jumpToSection(['NEET', 'PYQs'])">📄 Previous Year Papers</a>
            </div>
        </div>
    </div>

    <!-- Floating AI Button & Modal (Remains Unchanged) -->
    <div id="ai-floating-btn" onclick="document.getElementById('aiModal').style.display='flex'">✨ Ask AI</div>

    <div id="aiModal" class="modal-overlay" style="z-index: 4000; padding: 0; display:none;">
        <div class="modal-content ai-fullscreen-modal">
            <button class="ai-exit-btn" onclick="document.getElementById('aiModal').style.display='none'">✕</button>
            <div class="ai-workspace">
                <h2 style="color: #fff;">Ask AI Tutor</h2>
                <textarea id="aiTextInput" class="input-field" placeholder="Type a formula, chapter topic, or question stem..." style="min-height: 120px; font-size:16px; background: rgba(18, 20, 28, 0.75);"></textarea>
                <button class="btn-exam" onclick="processAIText()" style="width:100%; background: linear-gradient(135deg, var(--primary-yellow), #ff9800); color:black; font-size:17px; padding:16px; margin-top: 15px;">Solve Text Question 🚀</button>
                
                <div class="ai-right-panel" style="margin-top: 20px;">
                    <div id="ai-chat-history" style="flex:1; overflow-y:auto; padding-right:15px; margin-bottom:20px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
