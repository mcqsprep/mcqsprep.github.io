  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQs Prep | Competitive Exams</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">MCQs Prep.</div>
    </nav>

    <div class="main-container">
        
        <!-- SECTION 1: Category Menu -->
        <div id="category-screen">
            <h1 id="menu-title">Select Your Exam</h1>
            <p class="subtitle" id="subtitle">Choose a category to start practicing.</p>
            
            <div class="category-grid" id="category-grid">
                <!-- JavaScript creates the menu buttons here -->
            </div>
            
            <button id="back-btn" class="hidden" onclick="goBack()">&larr; Go Back</button>
        </div>

        <!-- SECTION 2: Quiz Engine -->
        <div id="quiz-screen" class="hidden">
            <header>
                <h2 id="exam-title">Exam Title</h2>
                <div class="score-board">Score: <span id="score">0</span></div>
            </header>
            
            <div id="quiz-content">
                <h3 id="question">Loading question...</h3>
                <div class="options-container" id="options">
                    <!-- Option buttons appear here -->
                </div>
                <button id="next-btn" class="hidden" onclick="nextQuestion()">Next Question</button>
            </div>

            <!-- SECTION 3: Results -->
            <div id="result-screen" class="hidden">
                <h2>Test Completed!</h2>
                <p>Your Final Score: <span id="final-score">0</span> / <span id="total-questions">0</span></p>
                <button class="primary-btn" onclick="returnToHome()">Return to Home Menu</button>
            </div>
        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
